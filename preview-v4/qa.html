<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reyhaneh viewport QA</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e7eb;font:12px system-ui;color:#332c39}header{height:58px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #bcb6bf;background:white;color:#382e3d;padding:7px 10px;border-radius:6px;cursor:pointer}#site-frame{display:block;width:390px;height:844px;max-width:100%;border:0;margin:0 auto;box-shadow:0 10px 40px #20112340;background:#21131f}#metrics{font:11px monospace;min-width:150px}#errors{white-space:pre-wrap;color:#c21f3c;position:absolute;left:8px;bottom:8px;max-width:250px}</style></head><body><header><strong>Viewport</strong><button data-width="320">320</button><button data-width="360">360</button><button data-width="390">390</button><button data-width="430">430</button><button data-width="1140">Desktop</button><select id="section"><option value="home">Home</option><option value="ch1">Heart</option><option value="ch2">Letters</option><option value="ch3">Wheel</option><option value="ch4">Garden</option><option value="ch5">Lanterns</option><option value="ch6">Scratch</option><option value="ch7">Compass</option><option value="ch8">Rain</option><option value="finale">Finale</option></select><button id="fresh">Fresh test</button><button id="legacy">Legacy progress</button><span id="metrics"></span></header><iframe id="site-frame" src="index.html#ch1" title="Reyhaneh mobile viewport"></iframe><div id="errors"></div><script>
const frame=document.querySelector('iframe'),metrics=document.querySelector('#metrics');let cls=0;
function update(){const w=frame.contentWindow,d=w.document;metrics.textContent=w.innerWidth+' × '+w.innerHeight+' | overflow '+Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth)+' | CLS '+cls.toFixed(3)}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';setTimeout(update,400)});
document.querySelector('#section').onchange=e=>{const w=frame.contentWindow,d=w.document;d.getElementById(e.target.value)?.scrollIntoView({behavior:'instant',block:'start'});update()};
document.querySelector('#fresh').onclick=()=>{for(const k of Object.keys(localStorage))if(k.startsWith('reyhaneh-preview.'))localStorage.removeItem(k);frame.contentWindow.location.reload()};
document.querySelector('#legacy').onclick=()=>{localStorage.setItem('reyhaneh-preview.reyhaneh.v2.progress','[1,2,3,4,5,6,7,8]');frame.contentWindow.location.reload()};
frame.onload=()=>{cls=0;const w=frame.contentWindow;w.addEventListener('error',e=>document.querySelector('#errors').textContent+=e.message+'\n');try{new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)cls+=e.value;update()}).observe({type:'layout-shift',buffered:true})}catch{}w.addEventListener('scroll',update,{passive:true});setTimeout(update,400);};setInterval(update,2000);
</script></body></html>
