<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22060f"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>ریحانه | یک قصه برای دو نفر</title>
<script>try{if(localStorage.getItem('reyhaneh.unlocked')==='1')location.replace('story.html')}catch(e){}</script>
<link rel="icon" href="assets/icons.svg" type="image/svg+xml">
<style>
@font-face{font-family:Vazirmatn;src:url('assets/vazirmatn.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Naskh;src:url('assets/naskh.ttf') format('truetype');font-weight:400 700;font-display:swap}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Vazirmatn,system-ui,sans-serif;color:#ffeef3;background:radial-gradient(120% 90% at 50% 0%,#3d1224 0%,#22060f 55%,#170309 100%);overflow:hidden}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-4vh;width:13px;height:17px;border-radius:80% 4px 80% 4px;background:linear-gradient(145deg,rgba(255,183,205,.75),rgba(214,51,108,.5));opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-4vh,0) rotate(0);opacity:0}10%{opacity:.8}92%{opacity:.55}100%{transform:translate3d(var(--sway,30px),104vh,0) rotate(310deg);opacity:0}}
.card{position:relative;width:min(370px,100%);text-align:center;transition:opacity .5s ease,transform .5s ease}
.card.leaving{opacity:0;transform:scale(.97)}
.heart{display:grid;place-items:center;width:88px;height:88px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffb1c9,#f75f8e 58%,#d6336c);box-shadow:0 18px 48px rgba(247,95,142,.5);animation:pulse 2.2s ease-in-out infinite}
.heart svg{width:40px;height:40px;fill:#fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
h1{font-family:Naskh,serif;font-weight:600;font-size:27px;line-height:1.7;margin:0 0 8px}
.sub{margin:0 0 26px;color:#f3b8c9;font-size:14px;line-height:2}
form{display:flex;gap:10px;justify-content:center}
input{width:158px;padding:13px 14px;border-radius:999px;border:1px solid rgba(255,177,201,.45);background:rgba(255,255,255,.08);color:#fff;font-family:Vazirmatn,sans-serif;font-weight:700;font-size:18px;text-align:center;letter-spacing:.35em;outline:none}
input:focus{border-color:#ff9eb8;background:rgba(255,255,255,.13)}
input::placeholder{letter-spacing:0;font-size:13px;font-weight:400;color:#c98a9e}
button{padding:13px 26px;border:0;border-radius:999px;background:linear-gradient(135deg,#fff1f4,#ffc9d8);color:#7c1530;font-family:Vazirmatn,sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 12px 30px rgba(247,95,142,.35)}
button:active{transform:scale(.97)}
.error{margin:18px 0 0;color:#ff8fab;font-size:13px;min-height:20px}
.card.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){.heart,.petals i{animation:none}.petals{display:none}}
</style>
</head><body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main class="card" id="card">
 <span class="heart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
 <h1>این دنیا، فقط برای یک نفره</h1>
 <p class="sub">اگه اون نفری، رمز رو بزن و بیا تو</p>
 <form id="form" autocomplete="off" onsubmit="return false">
  <input id="input" type="password" inputmode="numeric" autocomplete="off" placeholder="رمز" aria-label="رمز ورود" dir="ltr">
  <button type="submit" id="btn">بازش کن</button>
 </form>
 <p class="error" id="error" role="alert"></p>
</main>
<script>
(function(){
var SHA='e8bd7957a6e9cdcbccec9465f0f1557c33beee621bd1c708b9040559dd57100e',FNV=722053551;
var petals=document.getElementById('petals');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(var i=0;i<14;i++){var p=document.createElement('i');p.style.cssText='left:'+(Math.random()*98)+'%;--sway:'+(Math.random()*70-35)+'px;animation-duration:'+(8+Math.random()*8)+'s;animation-delay:'+(-Math.random()*14)+'s';petals.append(p)}}
function norm(s){return s.replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/\s+/g,'')}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h}
var card=document.getElementById('card'),form=document.getElementById('form'),input=document.getElementById('input'),error=document.getElementById('error'),btn=document.getElementById('btn');
function open(){try{localStorage.setItem('reyhaneh.unlocked','1')}catch(e){}btn.textContent='داره باز می‌شه…';card.classList.add('leaving');setTimeout(function(){location.replace('story.html')},480)}
function wrong(){error.textContent='این رمز نیست؛ دوباره تلاش کن';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');input.select()}
form.addEventListener('submit',function(e){e.preventDefault();var v=norm(input.value);if(!v)return;
if(window.crypto&&crypto.subtle&&crypto.subtle.digest){crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(buf){var hex=[].map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0')}).join('');(hex===SHA||fnv(v)===FNV)?open():wrong()}).catch(function(){fnv(v)===FNV?open():wrong()})}
else{fnv(v)===FNV?open():wrong()}});
setTimeout(function(){try{input.focus({preventScroll:true})}catch(e){}},450);
})();
</script>
</body></html>
